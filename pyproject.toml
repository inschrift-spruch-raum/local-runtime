[project]
name = "local-runtime"
version = "0.1.0"
description = "A reusable local runtime for GUI and headless MCP instances."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "inschrift.spruch.raum" },
]
repository = "https://github.com/inschrift-spruch-raum/local-runtime"
homepage = "https://github.com/inschrift-spruch-raum/local-runtime"
keywords = ["mcp", "gui", "headless", "json-rpc", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py314"
lint.extend-select = ["ALL"]
lint.ignore = ["COM812", "D203", "D212"]
lint.per-file-ignores = { "tests/**/*.py" = ["S101"] }

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["src"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__", "**/.*"]
