name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.14
      - name: Lint
        run: uv run --locked --python 3.14 ruff check .
      - name: Check formatting
        run: uv run --locked --python 3.14 ruff format --check .
      - name: Type check
        run: uv run --locked --python 3.14 basedpyright
      - name: Test
        run: uv run --locked --python 3.14 pytest
      - name: Build
        run: uv build
